<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rowen's Space</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fafaf9; --card: #fff; --sidebar: #f5f5f3;
  --text: #1a1a1a; --text-soft: #666; --text-light: #999;
  --border: #e8e8e4; --accent: #8cbf8c; --accent-bg: #f0f7f0;
  --radius: 14px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02);
  --transition: .25s cubic-bezier(.4,0,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.app { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 70px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px; z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; border-radius: var(--radius-xs); font-size: 10px; color: var(--text-soft); cursor: pointer; transition: all var(--transition); border: none; background: none; font-family: inherit; flex: 1; max-width: 80px; }
.nav-item .ni-icon { font-size: 20px; line-height: 1; }
.nav-item:hover { color: var(--text); }
.nav-item.active { color: var(--accent); font-weight: 500; }
.sidebar-foot { padding: 6px 16px; font-size: 10px; color: var(--text-light); text-align: center; }
.sync-dot { width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px; }
.sync-online .sync-dot{background:#8cbf8c;}
.sync-offline .sync-dot{background:#d88;animation:pulse2 1.5s ease infinite;}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.3}}
.main { flex: 1; padding: 24px 20px 40px; max-width: 900px; margin: 0 auto; width: 100%; }
.main-header { margin-bottom:28px; }
.main-header h1 { font-size:24px; font-weight:500; }
.main-header .date { font-size:13px; color:var(--text-light); margin-top:2px; }
.module { animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.card { background:var(--card); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:20px; }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.card-title { font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.card-title .dot { width:7px;height:7px;border-radius:50%;background:var(--accent); }

/* ── Home ── */
.home-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.home-section-title { font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:10px; letter-spacing:.5px; }
.home-todo-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.home-todo-item:last-child{border-bottom:none;}
.home-todo-dot { width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0; }
.home-todo-text { flex:1; }
.home-stat-card { text-align:center; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); }
.home-stat-val { font-size:28px; font-weight:500; }
.home-stat-label { font-size:11px; color:var(--text-light); margin-top:2px; }
.home-checkin-btn { width:100%; padding:10px; border:1.5px dashed var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text-soft); font-size:13px; cursor:pointer; transition:all var(--transition); display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:8px; }
.home-checkin-btn:hover { border-color:var(--accent); color:#4a8; background:var(--accent-bg); }
.home-checkin-btn.checked { background:var(--accent-bg); border-color:var(--accent); color:#4a8; border-style:solid; }

/* ── AI Input ── */
.ai-box { position: relative; margin-bottom: 20px; }
.ai-input-wrap { display: flex; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px 6px 14px; transition: border var(--transition), box-shadow var(--transition); }
.ai-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140,191,140,.15); }
.ai-input {
  flex: 1; border: none; padding: 10px 0; font-size: 14px; color: var(--text);
  background: none; outline: none; font-family: inherit; resize: none; min-height: 20px;
  line-height: 1.5;
}
.ai-input::placeholder { color: var(--text-light); }
.ai-voice-btn {
  width: 38px; height: 38px; border: none; border-radius: 50%; cursor: pointer;
  background: var(--bg); font-size: 18px; transition: all var(--transition);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ai-voice-btn:hover { background: var(--accent-bg); }
.ai-voice-btn.recording { background: #fdd; animation: pulse-rec 1s ease infinite; }
@keyframes pulse-rec { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.1); } }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-submit-btn {
  width: 38px; height: 38px; border: none; border-radius: 50%; cursor: pointer;
  background: var(--accent); color: #fff; font-size: 16px; transition: all var(--transition);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ai-submit-btn:hover { opacity: .85; transform: scale(1.04); }
.ai-submit-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.ai-result {
  margin-top: 10px; padding: 10px 14px; background: var(--accent-bg); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text-soft); display: none; animation: fadeSlideIn .3s ease;
}
.ai-result.show { display: block; }
.ai-result-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.ai-result-item .ai-dot { color: var(--accent); }
.ai-settings {
  margin-top: 8px; font-size: 11px; color: var(--text-light); display: none;
}
.ai-settings.show { display: block; animation: fadeSlideIn .3s ease; }
.ai-settings input {
  border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 6px 10px;
  font-size: 12px; width: 280px; background: #fff; outline: none; color: var(--text);
}
.ai-settings input:focus { border-color: var(--accent); }
.ai-settings .btn-sm { margin-left: 6px; }

/* ── Todo ── */
.todo-tabs { display:flex; gap:2px; background:var(--bg); border-radius:20px; padding:3px; }
.todo-tab { border:none;background:none;font-size:12px;color:var(--text-soft); padding:5px 14px;border-radius:18px;cursor:pointer;transition:all var(--transition); }
.todo-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.todo-migrate{font-size:11px;color:var(--text-soft);padding:6px 10px;background:var(--accent-bg);border-radius:var(--radius-xs);margin-bottom:12px;animation:fadeSlideIn .35s ease;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(12px)}}
.todo-list{display:flex;flex-direction:column;gap:6px;min-height:40px;}
.todo-item{display:flex;align-items:flex-start;gap:8px;padding:10px;border-radius:var(--radius-xs);transition:all var(--transition);cursor:grab;animation:fadeSlideIn .35s ease both;}
.todo-item:hover{background:rgba(0,0,0,.02);}
.todo-item.dragging{opacity:.5;background:var(--accent-bg);}
.todo-item.done{opacity:.5;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light);}
.todo-drag{width:16px;height:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-light);flex-shrink:0;padding-top:2px;opacity:0;transition:opacity var(--transition);}
.todo-item:hover .todo-drag{opacity:1;}
.todo-drag span{width:10px;height:1.5px;background:var(--text-light);border-radius:1px;display:block;}
.todo-cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid #d0d0d0;border-radius:50%;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all var(--transition);position:relative;}
.todo-cb:hover{border-color:var(--accent);}
.todo-cb:checked{background:var(--accent);border-color:var(--accent);}
.todo-cb:checked::after{content:'';position:absolute;top:3px;left:5px;width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:13px;word-break:break-word;}
.todo-meta{display:flex;gap:10px;margin-top:2px;font-size:11px;color:var(--text-light);}
.todo-time{color:var(--accent);}
.todo-sub-count{cursor:pointer;}
.todo-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity var(--transition);}
.todo-item:hover .todo-actions{opacity:1;}
.btn-del{width:22px;height:22px;border:none;background:none;color:var(--text-light);cursor:pointer;font-size:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.5;transition:all var(--transition);}
.btn-del:hover{opacity:1;color:#d44;}
.todo-subtasks{margin-left:42px;border-left:1.5px solid var(--border);padding-left:12px;display:none;margin-bottom:4px;}
.todo-subtasks.show{display:block;animation:fadeSlideIn .3s ease;}
.todo-sub-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;}
.todo-sub-item .todo-cb{width:15px;height:15px;}
.todo-sub-item .todo-cb:checked::after{top:2px;left:4px;width:4px;height:7px;}
.todo-sub-item.done .sub-text{text-decoration:line-through;color:var(--text-light);}
.sub-text{flex:1;color:var(--text-soft);word-break:break-word;}
.todo-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.btn-sm{border:none;background:none;color:var(--text-soft);cursor:pointer;font-size:12px;padding:4px 10px;border-radius:var(--radius-xs);transition:all var(--transition);}
.btn-sm:hover{background:var(--bg);color:var(--text);}
.todo-sub-input{margin-top:8px;display:none;}
.todo-sub-input.show{display:flex;gap:6px;animation:fadeSlideIn .25s ease;}
.todo-sub-input input{flex:1;border:none;border-bottom:1px solid var(--border);font-size:12px;padding:3px 0;background:none;outline:none;color:var(--text);}
.todo-sub-input input:focus{border-color:var(--accent);}

/* ── General inputs ── */
.input-row{display:flex;gap:8px;margin-bottom:14px;}
.input-row input,.input-row select{flex:1;border:1px solid var(--border);border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border var(--transition);font-family:inherit;}
.input-row input:focus,.input-row select:focus{border-color:var(--accent);}
.input-row input::placeholder{color:var(--text-light);}
.btn-add{width:34px;height:34px;border:none;border-radius:var(--radius-xs);background:var(--accent);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity var(--transition),transform var(--transition);flex-shrink:0;}
.btn-add:hover{opacity:.85;transform:scale(1.04);}
.btn-add:active{transform:scale(.96);}

/* ── Life ── */
.life-category{margin-bottom:12px;}
.life-cat-label{font-size:11px;color:var(--text-light);letter-spacing:.8px;margin-bottom:4px;}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--radius-xs);transition:background var(--transition);animation:fadeSlideIn .35s ease both;}
.list-item:hover{background:rgba(0,0,0,.015);}
.list-item.done .item-text{color:var(--text-light);text-decoration:line-through;}
.item-text{flex:1;font-size:13px;}

/* ── Travel ── */
.travel-form{display:none;margin-bottom:14px;}
.travel-form.show{display:block;animation:fadeSlideIn .3s ease;}
.travel-form input,.travel-form textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 12px;font-size:13px;margin-bottom:8px;background:var(--bg);outline:none;color:var(--text);font-family:inherit;resize:none;}
.travel-form input:focus,.travel-form textarea:focus{border-color:var(--accent);}
.travel-form .form-row{display:flex;gap:8px;}
.travel-form .form-row input{flex:1;}
.travel-item{padding:14px;border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--border);transition:all var(--transition);animation:fadeSlideIn .35s ease both;cursor:pointer;}
.travel-item:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.05);}
.travel-date{font-size:11px;color:var(--text-light);}
.travel-location{font-size:15px;font-weight:600;margin:2px 0;}
.travel-note{font-size:12px;color:var(--text-soft);line-height:1.5;}
.travel-img{width:100%;height:120px;border-radius:var(--radius-sm);background:var(--bg);margin-top:8px;overflow:hidden;}
.travel-img img{width:100%;height:100%;object-fit:cover;}

/* ── Mood ── */
.mood-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.mood-btn{width:44px;height:44px;border:1.5px solid transparent;border-radius:50%;font-size:22px;cursor:pointer;background:var(--bg);transition:all var(--transition);display:flex;align-items:center;justify-content:center;}
.mood-btn:hover{transform:scale(1.1);}
.mood-btn.selected{border-color:var(--accent);transform:scale(1.12);background:#fff;}
.mood-note{width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;background:var(--bg);outline:none;color:var(--text);margin-bottom:10px;font-family:inherit;}
.mood-note:focus{border-color:var(--accent);}
.mood-history{max-height:220px;overflow-y:auto;}
.mood-entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;animation:fadeSlideIn .35s ease both;}
.mood-entry:last-child{border-bottom:none;}
.m-emoji{font-size:20px;}
.m-text{flex:1;color:var(--text-soft);}
.m-date{font-size:11px;color:var(--text-light);}

/* ── Body ── */
.body-tabs{display:flex;gap:2px;background:var(--bg);border-radius:20px;padding:3px;}
.body-tab{border:none;background:none;font-size:12px;color:var(--text-soft);padding:5px 12px;border-radius:18px;cursor:pointer;transition:all var(--transition);}
.body-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.body-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 12px;}
.ex-day-header{font-size:11px;color:var(--text-light);text-align:center;padding:4px 0;}
.body-day{aspect-ratio:1;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);color:var(--text-soft);background:var(--bg);}
.body-day:hover{transform:scale(1.1);}
.body-day.today{font-weight:700;color:var(--accent);}
.body-day.ex-done{background:#e4f0e4;color:#4a8;}
.body-day.wt-done{background:#f0ece8;color:#a86;}
.body-day.both-done{background:linear-gradient(135deg,#e4f0e4 50%,#f0ece8 50%);color:#4a8;font-weight:600;}
.body-panel{animation:fadeSlideIn .3s ease;}
.body-checkin-btn{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-soft);font-size:13px;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;}
.body-checkin-btn:hover{border-color:var(--accent);color:#4a8;background:var(--accent-bg);}
.body-checkin-btn.checked{background:var(--accent-bg);border-color:var(--accent);color:#4a8;border-style:solid;}
.body-stats-row{display:flex;justify-content:space-around;font-size:11px;color:var(--text-light);margin-top:10px;}
.body-stats-row b{color:var(--text);font-size:16px;font-weight:500;display:block;}
.body-weight-now{display:flex;align-items:flex-end;gap:6px;margin-bottom:10px;}
.bw-val{font-size:40px;font-weight:300;line-height:1;}
.bw-unit{font-size:13px;color:var(--text-light);margin-bottom:2px;}
.weight-delta{font-size:13px;margin-bottom:6px;padding:2px 8px;border-radius:20px;}
.weight-delta.up{color:#c88;background:#f8ece8;}
.weight-delta.down{color:#8a8;background:var(--accent-bg);}
.body-weight-input{display:flex;gap:6px;margin-bottom:12px;}
.body-weight-input input{flex:1;border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 12px;font-size:13px;background:var(--bg);outline:none;color:var(--text);}
.body-weight-input input:focus{border-color:var(--accent);}
.body-chart{width:100%;height:100px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px;}
.body-chart svg{width:100%;height:100%;}
.body-recent{max-height:100px;overflow-y:auto;}
.body-recent-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;animation:fadeSlideIn .35s ease both;}
.body-recent-item:last-child{border-bottom:none;}
.br-date{color:var(--text-light);}
.br-val{font-weight:500;}
.br-delta{font-size:10px;}
.br-delta.pos{color:#c88;}
.br-delta.neg{color:#8a8;}

/* ── Shared ── */
.empty-state{text-align:center;padding:24px;color:var(--text-light);font-size:13px;}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition);}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-content{background:#fff;border-radius:var(--radius);padding:20px;max-width:500px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.modal-content img{width:100%;border-radius:var(--radius-sm);}
.modal-content h3{margin-bottom:4px;}
.modal-content p{color:var(--text-soft);font-size:13px;margin:4px 0;}

/* ── Add Task Modal ── */
.add-task-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.add-task-overlay.show { opacity: 1; pointer-events: auto; }
.add-task-sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 28px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,.08); animation: sheetUp .3s ease; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.at-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.at-tabs { display: flex; gap: 8px; }
.at-tab { border: none; padding: 6px 16px; border-radius: 18px; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text-soft); transition: all var(--transition); font-family: inherit; }
.at-tab.active { background: var(--accent-soft-pink, #f8a8b8); color: #fff; }
.at-tab.work.active { background: #d8d8d8; }
.at-tab.life.active { background: #f5b8c4; color: #fff; }
.at-tab.schedule.active { background: #c8d4e0; }
.at-add-btn { font-size: 15px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 500; font-family: inherit; }
.at-title-input { width: 100%; border: none; border-left: 3px solid var(--accent); padding: 8px 0 8px 12px; font-size: 18px; color: var(--text); background: transparent; outline: none; font-family: inherit; margin-bottom: 14px; }
.at-title-input::placeholder { color: var(--text-light); }
.at-desc { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 10px 12px; font-size: 13px; color: var(--text); background: var(--bg); outline: none; font-family: inherit; margin-bottom: 16px; resize: none; min-height: 50px; }
.at-desc:focus { border-color: var(--accent); }
.at-section { margin-bottom: 14px; }
.at-section-label { font-size: 11px; color: var(--text-light); margin-bottom: 6px; letter-spacing: .5px; }
.at-date-options { display: flex; gap: 8px; flex-wrap: wrap; }
.at-date-chip { padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--text-soft); border: 1px solid var(--border); transition: all var(--transition); }
.at-date-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.at-date-chip input { display: none; }
.at-more { width: 100%; padding: 10px; background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 4px; }

async function bootstrap(){try{const{data,error}=await db.from('dashboard_data').select('module,data');if(error)throw error;setSyncStatus(true);setupRealtime();const seed={};if(data)data.forEach(r=>{if(Array.isArray(r.data))seed[r.module]=r.data;});const mods=['todos','life','travel','mood','exercise','weight'];let hl=false;for(const m of mods){if(!seed[m]){const l=loadLocal(m);seed[m]=l;if(l.length)hl=true;}}if(hl){for(const m of mods){if(seed[m].length)await db.from('dashboard_data').upsert({module:m,data:seed[m],updated_at:new Date()},{onConflict:'module'});}}return seed;}catch(e){setSyncStatus(false,'❌ '+(e.message||e.code||''));return null;}}

// ── AI & Voice ──

async function processAI(){

  try{
    const todayStr=fmtDate(new Date());
    const msgs=[{role:'system',content:`你是Rowen的个人助手，帮他把自然语言输入转化为具体操作。返回纯JSON数组，每个操作一个对象。

当前日期: ${todayStr}

支持的操作类型:

规则:

- "体重XX"、"称了XX"、"XX公斤" → weight
- "买XX"、"记得XX"、"要XX" 如果不是运动/体重 → add_life (cat根据内容判断:日用品/食物=shopping,其他=daily)
- "明天要XX" → add_todo with time或add_life
- 只输出JSON数组，不要其他文字

{role:'user',content:input}];
const resp=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',messages:msgs,temperature:0.1,max_tokens:500})});

if(!resp.ok)throw new Error(data.error?.message||'API请求失败');

}}
await saveCloud('todos',todos);await saveCloud('life',lifeItems);await saveCloud('exercise',exercises);await saveCloud('weight',weights);await saveCloud('mood',moods);

btn.disabled=false;btn.textContent='→';}
function renderHome(){const n=new Date(),ts=fmtDate(n);const td=todos.filter(t=>t.day==='today').sort((a,b)=>a.order-b.order);const undone=td.filter(t=>!t.done);const te=exercises.find(e=>e.date===ts&&e.type!=='rest');const ms=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;const me=exercises.filter(e=>e.date.startsWith(ms)&&e.type!=='rest');let sk=0,ck=new Date(n.getFullYear(),n.getMonth(),n.getDate());while(true){const ds=fmtDate(ck);if(exercises.find(e=>e.date===ds&&e.type!=='rest')){sk++;ck.setDate(ck.getDate()-1);}else break;}
const dk=getApiKey();
let h=`<div class="ai-box">

for(let i=firstDay-1;i>=0;i--)h+=`<div class="cal-day other"><div class="cal-day-num">${prevLast-i}</div><div class="cal-events"></div></div>`;
for(let d=1;d<=lastDay;d++){const ds=fmtDate(new Date(calYear,calMonth,d));const evts=getEventsOnDay(ds);const isToday=ds===ts;const isSel=calSelected===ds;let cls='cal-day';if(isToday)cls+=' today';if(isSel)cls+=' selected';const shown=evts.slice(0,3);const more=evts.length>3?`<div class="cal-more">+${evts.length-3}</div>`:'';
h+=`<div class="${cls}" data-date="${ds}" onclick="calSelect('${ds}')"><div class="cal-day-num"><span>${d}</span><span class="lunar">${d===1?lunarMonth(first):''}</span></div><div class="cal-events">${shown.map(e=>`<div class="cal-event ${e.type}">${e.text||e.tag}</div>`).join('')}${more}</div></div>`;}
const totalCells=firstDay+lastDay;const trailing=totalCells%7===0?0:7-totalCells%7;
for(let i=1;i<=trailing;i++)h+=`<div class="cal-day other"><div class="cal-day-num">${i}</div><div class="cal-events"></div></div>`;
h+='</div>';
if(calSelected){const evts=getEventsOnDay(calSelected);const dt=new Date(calSelected);const wd=['日','一','二','三','四','五','六'][dt.getDay()];h+=`<div class="cal-detail"><div class="cal-detail-title">${calSelected} 星期${wd}</div><div class="cal-detail-date">共 ${evts.length} 项</div>${evts.length?evts.map(e=>`<div class="cal-detail-row"><span class="cal-tag" style="background:${tagColor(e.type)}">${e.tag}</span><span>${escHtml(e.text||'')}</span></div>`).join(''):'<div class="empty-state">这一天没有记录</div>'}</div>`;}
return h;}
function bindCalendarCells(){/* no-op, onclick inline */}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}calSelected=null;renderTodo();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}calSelected=null;renderTodo();}
function calToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();calSelected=null;renderTodo();}
function calSelect(ds){calSelected=ds;renderTodo();}

// ── Add Task Modal ──
let atCat='life',atDateType='today';
function openAddTask(){const quick=$('#todo-quick-input')?.value?.trim();if(quick)$('#at-title').value=quick;$('#at-title').value=quick||'';$('#at-desc').value='';$('#at-time').value='';$('#at-date').value='';atCat='life';atDateType='today';updateAtChips();document.getElementById('add-task-overlay').classList.add('show');}
function closeAddTask(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('add-task-overlay').classList.remove('show');}
function toggleAtMore(){document.getElementById('at-more-expanded').classList.toggle('show');}
function updateAtChips(){document.querySelectorAll('.at-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===atCat));document.querySelectorAll('.at-date-chip').forEach(c=>c.classList.toggle('active',c.dataset.type===atDateType));}
document.querySelectorAll('.at-tab').forEach(t=>{t.addEventListener('click',()=>{atCat=t.dataset.cat;updateAtChips();});});
document.querySelectorAll('.at-date-chip').forEach(c=>{c.addEventListener('click',()=>{atDateType=c.dataset.type;updateAtChips();});});
async function submitAddTask(){
  const title=$('#at-title')?.value?.trim();if(!title)return toast('请输入任务标题');
  const desc=$('#at-desc')?.value?.trim();
  const time=$('#at-time')?.value;
  const date=$('#at-date')?.value;
  const n=new Date();
  const todayStr=fmtDate(n);
  const tomorrow=new Date(n);tomorrow.setDate(n.getDate()+1);const tomorrowStr=fmtDate(tomorrow);
  let targetDate;
  if(date)targetDate=date;
  else if(atDateType==='today')targetDate=todayStr;
  else if(atDateType==='tomorrow')targetDate=tomorrowStr;
  else targetDate=null;
  const day=atDateType==='tomorrow'?'tomorrow':'today';
  if(atCat==='life'||atCat==='shopping'){
    const realCat=atCat==='shopping'?'shopping':'daily';
    lifeItems.unshift({text:title+(desc?` (${desc})`:''),cat:realCat,done:false,id:Date.now()});
    await saveCloud('life',lifeItems);
    toast('已加入清单');
  }else{
    const mx=Math.max(...todos.filter(x=>x.day===day&&x.day!==undefined).map(x=>x.order),0);
    todos.push({id:Date.now().toString(),text:title,time:time||'',day:day,date:targetDate||todayStr,done:false,order:mx+1,subtasks:[],note:desc||'',migrated:false});
    await saveCloud('todos',todos);
    toast('已添加任务');
  }
  document.getElementById('add-task-overlay').classList.remove('show');
  renderCurrent();
}

// ── Init ──
updateHeader();activeDay=currentDay();
(async function(){const s=await bootstrap();if(s){todos=s.todos||[];lifeItems=s.life||[];travels=s.travel||[];moods=s.mood||[];exercises=s.exercise||[];weights=s.weight||[];}else{todos=loadLocal('todos');lifeItems=loadLocal('life');travels=loadLocal('travel');moods=loadLocal('mood');exercises=loadLocal('exercise');weights=loadLocal('weight');}renderCurrent();})();
</script>
