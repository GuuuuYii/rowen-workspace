<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rowen's Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f8f6f3;
    --card: #ffffff;
    --text: #3d3733;
    --text-soft: #8a8078;
    --text-light: #b5aca4;
    --border: #ebe6e0;
    --accent: #b8a99a;
    --accent-soft: #e8d5c8;
    --sage: #cfd8c8;
    --sage-soft: #eaf0e4;
    --blue: #c8d4e0;
    --blue-soft: #e8eef5;
    --warn: #e8c8c0;
    --warn-soft: #f8ece8;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
    --shadow-hover: 0 4px 16px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.03);
    --transition: 0.25s cubic-bezier(.4,0,.2,1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .container { max-width: 1400px; margin: 0 auto; padding: 32px 28px 60px; }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px; padding: 0 4px;
  }
  .header-left h1 { font-size: 28px; font-weight: 500; letter-spacing: -.3px; }
  .header-left .subtitle { font-size: 14px; color: var(--text-soft); margin-top: 2px; }
  .header-right {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--text-soft);
  }
  .header-right .date { font-size: 32px; font-weight: 300; line-height: 1; }
  .header-right .date-meta { text-align: right; }
  .header-right .date-meta span { display: block; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    transition: box-shadow var(--transition), transform var(--transition);
    position: relative;
    overflow: hidden;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .card-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  }
  .card-count {
    font-size: 12px; color: var(--text-light);
  }

  /* ── Input Row ── */
  .input-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .input-row input {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius-xs);
    padding: 9px 12px; font-size: 13px; color: var(--text);
    background: var(--bg); outline: none; transition: border var(--transition);
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row input::placeholder { color: var(--text-light); }
  .btn-add {
    width: 34px; height: 34px; border: none; border-radius: var(--radius-xs);
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--transition), transform var(--transition);
    flex-shrink: 0;
  }
  .btn-add:hover { opacity: .85; transform: scale(1.04); }
  .btn-add:active { transform: scale(.96); }

  /* ── List Item ── */
  .list-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px; border-radius: var(--radius-xs);
    transition: background var(--transition);
    animation: fadeSlideIn .35s ease both;
  }
  .list-item:hover { background: rgba(0,0,0,.015); }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(12px); }
  }
  .list-item.removing { animation: fadeSlideOut .25s ease forwards; }

  .list-item input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; border: 1.5px solid var(--border);
    border-radius: 50%; cursor: pointer; flex-shrink: 0;
    transition: all var(--transition); position: relative;
  }
  .list-item input[type="checkbox"]:checked {
    background: var(--accent); border-color: var(--accent);
  }
  .list-item input[type="checkbox"]:checked::after {
    content: ''; position: absolute; top: 3px; left: 5px;
    width: 5px; height: 8px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .list-item .item-text {
    flex: 1; font-size: 13px; color: var(--text);
    transition: color var(--transition), text-decoration var(--transition);
  }
  .list-item.done .item-text {
    color: var(--text-light); text-decoration: line-through;
    text-decoration-color: var(--text-light); text-decoration-thickness: .8px;
  }
  .list-item .item-time {
    font-size: 11px; color: var(--text-light); flex-shrink: 0;
  }
  .list-item .btn-del {
    width: 22px; height: 22px; border: none; background: none;
    color: var(--text-light); cursor: pointer; font-size: 14px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all var(--transition); flex-shrink: 0;
  }
  .list-item:hover .btn-del { opacity: .6; }
  .list-item .btn-del:hover { opacity: 1; color: #c88; background: var(--warn-soft); }

  /* ── Travel Card ── */
  .travel-item {
    padding: 14px; border-radius: var(--radius-sm); margin-bottom: 10px;
    border: 1px solid var(--border); transition: all var(--transition);
    animation: fadeSlideIn .35s ease both; cursor: pointer;
  }
  .travel-item:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); }
  .travel-item .travel-date { font-size: 11px; color: var(--text-light); }
  .travel-item .travel-location { font-size: 15px; font-weight: 600; margin: 2px 0; }
  .travel-item .travel-note { font-size: 12px; color: var(--text-soft); line-height: 1.5; }
  .travel-item .travel-img {
    width: 100%; height: 120px; border-radius: var(--radius-sm);
    background: var(--bg); margin-top: 8px; object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-light); font-size: 12px; overflow: hidden;
  }
  .travel-item .travel-img img { width: 100%; height: 100%; object-fit: cover; }
  .travel-form { display: none; margin-bottom: 14px; }
  .travel-form.show { display: block; animation: fadeSlideIn .3s ease; }
  .travel-form input, .travel-form textarea {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-xs);
    padding: 8px 12px; font-size: 13px; margin-bottom: 8px;
    background: var(--bg); outline: none; color: var(--text);
    font-family: inherit; resize: none;
  }
  .travel-form input:focus, .travel-form textarea:focus { border-color: var(--accent); }
  .travel-form textarea { height: 60px; }
  .travel-form .form-row { display: flex; gap: 8px; }
  .travel-form .form-row input { flex: 1; }

  /* ── Mood ── */
  .mood-grid {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .mood-btn {
    width: 44px; height: 44px; border: 1.5px solid transparent;
    border-radius: 50%; font-size: 22px; cursor: pointer;
    background: var(--bg); transition: all var(--transition);
    display: flex; align-items: center; justify-content: center;
  }
  .mood-btn:hover { transform: scale(1.1); }
  .mood-btn.selected { border-color: var(--accent); transform: scale(1.12); background: #fff; }
  .mood-note {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-xs);
    padding: 9px 12px; font-size: 13px; background: var(--bg); outline: none;
    color: var(--text); margin-bottom: 10px; font-family: inherit;
  }
  .mood-note:focus { border-color: var(--accent); }
  .mood-history { max-height: 160px; overflow-y: auto; }
  .mood-entry {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 13px; animation: fadeSlideIn .35s ease both;
  }
  .mood-entry:last-child { border-bottom: none; }
  .mood-entry .m-emoji { font-size: 20px; }
  .mood-entry .m-text { flex: 1; color: var(--text-soft); }
  .mood-entry .m-date { font-size: 11px; color: var(--text-light); }

  /* ── Exercise Calendar ── */
  .ex-calendar {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 14px;
  }
  .ex-day-header {
    font-size: 11px; color: var(--text-light); text-align: center;
    padding: 4px 0;
  }
  .ex-day {
    aspect-ratio: 1; border-radius: var(--radius-xs);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; border: 1px solid transparent;
    transition: all var(--transition); position: relative; color: var(--text-soft);
  }
  .ex-day:hover { border-color: var(--accent); }
  .ex-day.today { font-weight: 600; color: var(--accent); }
  .ex-day.done {
    background: var(--sage-soft); color: var(--text);
  }
  .ex-day.done::after {
    content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--sage);
  }
  .ex-day.rest {
    background: var(--warn-soft); color: var(--text-soft);
  }
  .ex-stats { display: flex; gap: 20px; }
  .ex-stat { text-align: center; }
  .ex-stat-val { font-size: 24px; font-weight: 300; color: var(--text); }
  .ex-stat-label { font-size: 11px; color: var(--text-light); }

  /* ── Weight ── */
  .weight-display {
    display: flex; align-items: flex-end; gap: 10px; margin-bottom: 16px;
  }
  .weight-now { font-size: 42px; font-weight: 300; line-height: 1; }
  .weight-unit { font-size: 14px; color: var(--text-light); margin-bottom: 4px; }
  .weight-delta {
    font-size: 13px; margin-bottom: 6px; padding: 2px 8px;
    border-radius: 20px; font-weight: 500;
  }
  .weight-delta.up { color: #c88; background: var(--warn-soft); }
  .weight-delta.down { color: #8a8; background: var(--sage-soft); }
  .weight-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .weight-input-row input {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius-xs);
    padding: 9px 12px; font-size: 13px; background: var(--bg); outline: none;
    color: var(--text);
  }
  .weight-input-row input:focus { border-color: var(--accent); }
  .weight-chart {
    width: 100%; height: 120px; border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .weight-chart svg { width: 100%; height: 100%; }
  .weight-history { max-height: 120px; overflow-y: auto; margin-top: 10px; }
  .weight-entry {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: 12px; animation: fadeSlideIn .35s ease both;
  }
  .weight-entry:last-child { border-bottom: none; }
  .weight-entry .w-date { color: var(--text-light); }
  .weight-entry .w-val { font-weight: 500; }
  .weight-entry .w-delta { font-size: 11px; font-weight: 500; }
  .weight-entry .w-delta.pos { color: #c88; }
  .weight-entry .w-delta.neg { color: #8a8; }

  /* ── Plan (今日计划) Time blocks ── */
  .plan-blocks { display: flex; flex-direction: column; gap: 8px; }
  .plan-block {
    display: flex; gap: 12px; align-items: flex-start;
    animation: fadeSlideIn .35s ease both;
  }
  .plan-block .pb-time {
    width: 48px; font-size: 13px; font-weight: 500; color: var(--accent);
    flex-shrink: 0; padding-top: 2px;
  }
  .plan-block .pb-content {
    flex: 1; font-size: 13px; padding: 6px 10px; border-radius: var(--radius-xs);
    background: var(--bg); display: flex; align-items: center; justify-content: space-between;
    transition: background var(--transition);
  }
  .plan-block:hover .pb-content { background: var(--border); }

  /* ── Life List ── */
  .life-category { margin-bottom: 12px; }
  .life-cat-label {
    font-size: 11px; color: var(--text-light); text-transform: uppercase;
    letter-spacing: .8px; margin-bottom: 4px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── Empty State ── */
  .empty-state {
    text-align: center; padding: 24px; color: var(--text-light); font-size: 13px;
  }

  /* ── Responsive ── */
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .container { padding: 20px 14px 40px; }
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 24px;
    border-radius: 24px; font-size: 13px; opacity: 0;
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ── Modal for travel image ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity var(--transition);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #fff; border-radius: var(--radius); padding: 20px;
    max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  .modal-content img { width: 100%; border-radius: var(--radius-sm); }
  .modal-content h3 { margin-bottom: 4px; }
  .modal-content p { color: var(--text-soft); font-size: 13px; margin: 4px 0; }

  .btn-sm {
    border: none; background: none; color: var(--text-soft); cursor: pointer;
    font-size: 12px; padding: 4px 10px; border-radius: var(--radius-xs);
    transition: all var(--transition);
  }
  .btn-sm:hover { background: var(--bg); color: var(--text); }

  /* ── Sync Status ── */
  .sync-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-light);
    padding: 3px 10px; border-radius: 20px; letter-spacing: .4px;
  }
  .sync-status.online { color: #7a9; }
  .sync-status.offline { color: #c88; }
  .sync-status .sync-dot {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
  }
  .sync-status.online .sync-dot { background: #8b8; }
  .sync-status.offline .sync-dot { background: #c88; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── Loading ── */
  .card-loading {
    display: flex; align-items: center; justify-content: center;
    padding: 30px; color: var(--text-light); font-size: 13px;
  }
  .card-loading::before {
    content: ''; display: inline-block; width: 14px; height: 14px;
    border: 1.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Ivy Lee Todo System ── */
  .todo-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 20px; padding: 3px; }
  .todo-tab {
    border: none; background: none; font-size: 12px; color: var(--text-soft);
    padding: 5px 14px; border-radius: 18px; cursor: pointer; font-weight: 500;
    transition: all var(--transition); line-height: 1.4;
  }
  .todo-tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .todo-migrate {
    font-size: 11px; color: var(--text-soft); padding: 6px 10px;
    background: #f0f9f8; border-radius: var(--radius-xs); margin-bottom: 12px;
    animation: fadeSlideIn .35s ease;
  }
  .todo-migrate b { color: #00A19B; }
  .todo-list { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .todo-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px; border-radius: var(--radius-xs);
    transition: all var(--transition); cursor: grab;
    animation: fadeSlideIn .35s ease both; position: relative;
  }
  .todo-item:hover { background: rgba(0,161,155,.04); }
  .todo-item.dragging { opacity: .5; background: rgba(0,161,155,.08); }
  .todo-item.drag-over { border-top: 2px solid #00A19B; }
  .todo-item.done { opacity: .55; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-light); text-decoration-color: var(--text-light); text-decoration-thickness: .8px; }
  .todo-drag {
    width: 16px; height: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    color: var(--text-light); cursor: grab; flex-shrink: 0; padding-top: 2px;
    opacity: 0; transition: opacity var(--transition);
  }
  .todo-item:hover .todo-drag { opacity: 1; }
  .todo-drag span { width: 10px; height: 1.5px; background: var(--text-light); border-radius: 1px; display: block; }
  .todo-cb {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; border: 1.5px solid #c0d6d4; border-radius: 50%;
    cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: all var(--transition);
    position: relative;
  }
  .todo-cb:hover { border-color: #00A19B; }
  .todo-cb:checked { background: #00A19B; border-color: #00A19B; }
  .todo-cb:checked::after {
    content: ''; position: absolute; top: 3px; left: 5px;
    width: 5px; height: 8px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .todo-body { flex: 1; min-width: 0; }
  .todo-text { font-size: 13px; color: var(--text); word-break: break-word; }
  .todo-meta { display: flex; gap: 10px; margin-top: 2px; font-size: 11px; color: var(--text-light); }
  .todo-time { color: #00A19B; }
  .todo-sub-count { cursor: pointer; }
  .todo-sub-count:hover { color: #00A19B; }
  .todo-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity var(--transition); }
  .todo-item:hover .todo-actions { opacity: 1; }
  .todo-actions .btn-del { opacity: .5; }
  .todo-actions .btn-del:hover { opacity: 1; }

  /* Subtasks */
  .todo-subtasks {
    margin-left: 42px; border-left: 1.5px solid #e0ecea; padding-left: 12px;
    display: none; margin-bottom: 4px;
  }
  .todo-subtasks.show { display: block; animation: fadeSlideIn .3s ease; }
  .todo-sub-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
  }
  .todo-sub-item .todo-cb { width: 15px; height: 15px; }
  .todo-sub-item .todo-cb:checked::after { top: 2px; left: 4px; width: 4px; height: 7px; }
  .todo-sub-item.done .sub-text { text-decoration: line-through; color: var(--text-light); }
  .sub-text { flex: 1; color: var(--text-soft); word-break: break-word; }
  .sub-add-row {
    display: flex; gap: 6px; padding: 4px 0; margin-left: 42px;
    border-left: 1.5px solid #e0ecea; padding-left: 12px; margin-top: 2px;
  }
  .sub-add-row input {
    flex: 1; border: none; border-bottom: 1px solid var(--border); font-size: 12px;
    padding: 3px 0; background: none; outline: none; color: var(--text);
  }
  .sub-add-row input:focus { border-color: #00A19B; }

  .todo-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .todo-sub-input { margin-top: 8px; display: none; }
  .todo-sub-input.show { display: flex; gap: 6px; animation: fadeSlideIn .25s ease; }

  /* ── MarkTimes-style Body Management ── */
  .body-tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 20px; padding: 3px; }
  .body-tab {
    border: none; background: none; font-size: 12px; color: var(--text-soft);
    padding: 5px 12px; border-radius: 18px; cursor: pointer; font-weight: 500;
    transition: all var(--transition);
  }
  .body-tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .body-calendar {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 14px 0 12px;
  }
  .body-day {
    aspect-ratio: 1; border-radius: 4px; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all var(--transition); color: var(--text-soft);
    position: relative; background: var(--bg);
  }
  .body-day:hover { transform: scale(1.1); }
  .body-day.today { font-weight: 700; color: #7eb8a0; }
  .body-day.ex-done { background: #d4e8dc; color: #4a8; }

<script>
// ── Supabase Config ──
const SUPABASE_URL = 'https://ubqmtpvbkrdgmijfppir.supabase.co';
const SUPABASE_KEY = 'sb_publishable_72YhJ6ANGV_sxAVLkdEuiw_zs58Kd89';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Utils ──
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function fmtDate(d) {
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function fmtTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s; return d.innerHTML;
}

// ── Cloud Sync Engine ──
let cloudReady = false;

function setSyncStatus(online, msg) {
  cloudReady = online;
  const el = $('#sync-status');
  el.className = 'sync-status ' + (online ? 'online' : 'offline');
  el.innerHTML = online
    ? '<span class="sync-dot"></span> ' + (msg || '已同步')
    : '<span class="sync-dot"></span> ' + (msg || '离线缓存中');
}

async function loadFromCloud(module) {
  if (!cloudReady) return loadLocal(module);
  try {
    const { data, error } = await db
      .from('dashboard_data').select('data').eq('module', module).maybeSingle();
    if (error) throw error;
    if (data) {
      saveLocal(module, data.data);
      return Array.isArray(data.data) ? data.data : [];
    }
    return [];
  } catch {
    setSyncStatus(false);
    return loadLocal(module);
  }
}

async function saveToCloud(module, arr) {
  saveLocal(module, arr);
  if (!cloudReady) return;
  try {
    const { error } = await db
      .from('dashboard_data').upsert({ module, data: arr, updated_at: new Date() }, { onConflict: 'module' });
    if (error) throw error;
    setSyncStatus(true);
  } catch {
    setSyncStatus(false);
  }
}

// ── Local fallback ──
const LS_PREFIX = 'db_';
function saveLocal(k, v) { try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); } catch {} }
function loadLocal(k) { try { return JSON.parse(localStorage.getItem(LS_PREFIX + k) || '[]'); } catch { return []; } }

// ── Real-time Subscription ──
function setupRealtime() {
  db
    .channel('dashboard-sync')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'dashboard_data' },
      (payload) => {
        if (!payload.new) return;
        const m = payload.new.module;
        const d = payload.new.data;
        if (!Array.isArray(d)) return;
        switch (m) {
          case 'todos': todos = d; activeDay = currentDay(); renderTodos(); break;
          case 'life': lifeItems = d; renderLife(); break;
          case 'travel': travels = d; renderTravels(); break;
          case 'mood': moods = d; renderMoods(); break;
          case 'exercise': exercises = d; renderBody(); break;
          case 'weight': weights = d; renderBody(); break;
        }
        toast('📡 数据已同步');
      }
    )
    .subscribe();
}

// ── Cloud Bootstrap & Migration ──
async function bootstrap() {
  try {
    const { data, error } = await db.from('dashboard_data').select('module,data');
    if (error) throw error;
    setSyncStatus(true);
    setupRealtime();
    const seed = {};
    if (data) data.forEach(r => { if (Array.isArray(r.data)) seed[r.module] = r.data; });
    // If no cloud data, migrate localStorage
    const modules = ['todos','life','travel','mood','exercise','weight'];
    let hasLocal = false;
    for (const m of modules) {
      if (!seed[m]) { const local = loadLocal(m); seed[m] = local; if (local.length > 0) hasLocal = true; }
    }
    if (hasLocal) {
      for (const m of modules) {
        if (seed[m].length > 0) {
          const { error: upsertErr } = await db.from('dashboard_data')
            .upsert({ module: m, data: seed[m], updated_at: new Date() }, { onConflict: 'module' });
          if (upsertErr) console.warn('Upsert failed for', m, upsertErr);
        }
      }
      toast('📡 本地数据已同步至云端');
    }
    return seed;
  } catch (e) {
    console.error('Bootstrap failed:', e);
    setSyncStatus(false, '❌ ' + (e.message || e.code || JSON.stringify(e).slice(0,60)));
    toast('⚠️ 云端连接失败，使用本地缓存');
    return null;
  }
}

// ── Header Date ──
function updateHeader() {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  $('#header-day').textContent = now.getDate();
  $('#header-weekday').textContent = '星期' + weekdays[now.getDay()];
  $('#header-date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月`;
}

// ── Data ──
let todos = [], lifeItems = [], travels = [], moods = [], exercises = [], weights = [];
let selectedMood = '', activeDay = 'today', activeSubTarget = null;

function currentDay() {
  const h = new Date().getHours();
  return h >= 18 ? 'tomorrow' : 'today';
}
function yesterdayStr() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return fmtDate(d);
}

// ── 1. Ivy Lee Todo System ──
function renderTodos() {
  const list = $('#todo-list');
  const todayStr = fmtDate(new Date());
  const ydayStr = yesterdayStr();

  // Auto-migrate: yesterday's unfinished → today
  let migrated = 0;
  todos.forEach(t => {
    if (!t.done && t.date === ydayStr && t.day === 'today') {
      t.date = todayStr; t.migrated = true; migrated++;
    }
  });
  if (migrated > 0) {
    saveToCloud('todos', todos);
    $('#todo-migrate').style.display = ''; $('#migrate-count').textContent = migrated;
    setTimeout(() => { $('#todo-migrate').style.display = 'none'; }, 5000);
  }

  // Today's unfinished → auto-set to today
  todos.forEach(t => {
    if (!t.done && t.date === todayStr && !t.migrated) { t.day = 'today'; }
  });

  const dayTodos = todos.filter(t => t.day === activeDay);
  dayTodos.sort((a,b) => a.order - b.order);

  list.innerHTML = dayTodos.map((t,i) => {
    const doneSubs = (t.subtasks||[]).filter(s=>s.done).length;
    const totalSubs = (t.subtasks||[]).length;
    return `
      <div class="todo-item ${t.done?'done':''}" draggable="true"
           data-id="${t.id}" data-idx="${i}"
           ondragstart="onDragStart(event)" ondragover="onDragOver(event)"
           ondragend="onDragEnd(event)" ondrop="onDrop(event)">
        <div class="todo-drag"><span></span><span></span></div>
        <input type="checkbox" class="todo-cb" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')">
        <div class="todo-body">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">
            ${t.time ? `<span class="todo-time">⏰ ${t.time}</span>` : ''}
            ${totalSubs > 0 ? `<span class="todo-sub-count" onclick="toggleSubtaskView('${t.id}')">📎 ${doneSubs}/${totalSubs}</span>` : ''}
            ${t.migrated ? '<span style="color:#00A19B">📥 昨日移入</span>' : ''}
          </div>
        </div>
        <div class="todo-actions">
          <button class="btn-del" onclick="event.stopPropagation();startAddSub('${t.id}')" title="添加子任务">+</button>
          <button class="btn-del" onclick="event.stopPropagation();removeTodo('${t.id}')">×</button>
        </div>
      </div>
      <div class="todo-subtasks ${activeSubTarget===t.id?'show':''}" id="subs-${t.id}">
        ${(t.subtasks||[]).map(s => `
          <div class="todo-sub-item ${s.done?'done':''}">
            <input type="checkbox" class="todo-cb" ${s.done?'checked':''} onchange="toggleSub('${t.id}','${s.id}')">
            <span class="sub-text">${escHtml(s.text)}</span>
            <button class="btn-del" style="opacity:.4;width:16px;height:16px;font-size:11px" onclick="removeSub('${t.id}','${s.id}')">×</button>
          </div>
        `).join('')}
        <div class="todo-sub-item" style="opacity:.6;cursor:pointer" onclick="startAddSub('${t.id}')">+ 添加子任务</div>
      </div>
    `;
  }).join('');

  if (!dayTodos.length) {
    const msg = activeDay === 'today' ? '今天暂时空白，添加你的第一个任务 ✦' : '为明天做好准备 🌙';
    list.innerHTML = `<div class="empty-state">${msg}</div>`;
  }

  const done = dayTodos.filter(t=>t.done).length;
  $('#todo-stats').textContent = dayTodos.length ? `完成 ${done}/${dayTodos.length}` : '';
}

async function addTodo() {
  const text = $('#todo-input').value.trim();
  if (!text) return toast('请输入任务');
  const time = $('#todo-time').value;
  const todayStr = fmtDate(new Date());
  const maxOrder = Math.max(...todos.filter(t=>t.day===activeDay).map(t=>t.order), 0);
  todos.push({
    id: Date.now().toString(), text, time, day: activeDay, date: todayStr,
    done: false, order: maxOrder + 1, subtasks: [], note: '', migrated: false
  });
  await saveToCloud('todos', todos); renderTodos();
  $('#todo-input').value = ''; $('#todo-time').value = '';
  activeSubTarget = null; toast('已添加');
}

async function toggleTodo(id) {
  const t = todos.find(t=>t.id===id);
  if (t) { t.done = !t.done; await saveToCloud('todos', todos); renderTodos(); }
}

async function removeTodo(id) {
  const el = document.querySelector(`.todo-item[data-id="${id}"]`);
  if (el) el.style.animation = 'fadeSlideOut .25s ease forwards';
  setTimeout(async () => {
    todos = todos.filter(t=>t.id!==id);
    await saveToCloud('todos', todos); renderTodos();
  }, 250);
}

// Subtasks
async function toggleSub(todoId, subId) {
  const t = todos.find(t=>t.id===todoId);
  if (!t) return;
  const s = t.subtasks.find(s=>s.id===subId);
  if (s) { s.done = !s.done; await saveToCloud('todos', todos); renderTodos(); }
}
async function removeSub(todoId, subId) {
  const t = todos.find(t=>t.id===todoId);
  if (t) { t.subtasks = t.subtasks.filter(s=>s.id!==subId); await saveToCloud('todos', todos); renderTodos(); }
}
function toggleSubtaskView(id) {
  activeSubTarget = (activeSubTarget === id) ? null : id;
  renderTodos();
}
function startAddSub(id) {
  activeSubTarget = id;
  renderTodos();
  setTimeout(() => { const el = document.querySelector(`#subs-${id} .todo-sub-item:last-child`); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100);
}
function toggleSubInput() {
  const el = $('#todo-sub-input'); el.classList.toggle('show');
  if (el.classList.contains('show')) setTimeout(() => $('#sub-input').focus(), 100);
}
async function addSubToActive() {
  const text = $('#sub-input').value.trim();
  if (!text || !activeSubTarget) return toast('请先展开一个任务的子任务列表，或输入子任务内容');
  const t = todos.find(t=>t.id===activeSubTarget);
  if (!t) return;
  if (!t.subtasks) t.subtasks = [];
  t.subtasks.push({ id: Date.now().toString(), text, done: false });
  await saveToCloud('todos', todos); renderTodos();
  $('#sub-input').value = ''; toast('子任务已添加');
}

// Tab switching
document.querySelectorAll('.todo-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.todo-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeDay = tab.dataset.day;
    activeSubTarget = null;
    renderTodos();
  });
});

// Drag & Drop
let dragId = null;
function onDragStart(e) {
  dragId = e.target.closest('.todo-item').dataset.id;
  e.target.closest('.todo-item').classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDragEnd(e) { e.target.closest('.todo-item')?.classList.remove('dragging'); dragId = null; }
async function onDrop(e) {
  e.preventDefault();
  const targetEl = e.target.closest('.todo-item');
  if (!targetEl || !dragId) return;
  const targetId = targetEl.dataset.id;
  if (dragId === targetId) return;
  const dragged = todos.find(t=>t.id===dragId);
  const target = todos.find(t=>t.id===targetId);
  if (!dragged || !target) return;
  const sameDay = todos.filter(t=>t.day===activeDay).sort((a,b)=>a.order-b.order);
  const dragIdx = sameDay.findIndex(t=>t.id===dragId);
  const targetIdx = sameDay.findIndex(t=>t.id===targetId);
  sameDay.splice(dragIdx, 1);
  sameDay.splice(targetIdx, 0, dragged);
  sameDay.forEach((t,i) => t.order = i + 1);
  // Update main array
  sameDay.forEach(t => { const idx = todos.findIndex(x=>x.id===t.id); if(idx>=0) todos[idx].order = t.order; });
  await saveToCloud('todos', todos); renderTodos();
}

// ── 3. Life List ──
function renderLife() {
  const cats = { daily: [], shopping: [], other: [] };
  lifeItems.forEach(l => { if (cats[l.cat]) cats[l.cat].push(l); });
  ['daily','shopping','other'].forEach(cat => {
    const el = $(`#life-${cat}`);
    const items = cats[cat];
    el.innerHTML = items.map((l,i) => {
      const idx = lifeItems.indexOf(l);
      return `<div class="list-item ${l.done?'done':''}" style="animation-delay:${i*.04}s">
        <input type="checkbox" ${l.done?'checked':''} onchange="toggleLife(${idx})">
        <span class="item-text">${escHtml(l.text)}</span>
        <button class="btn-del" onclick="event.stopPropagation();removeLife(${idx})">×</button>
      </div>`;
    }).join('');
    if (!items.length) el.innerHTML = '';
  });
  const undone = lifeItems.filter(l=>!l.done).length;
  $('#life-count').textContent = undone ? `${undone}项待办` : '';
}
async function addLife() {
  const text = $('#life-input').value.trim();
  const cat = $('#life-cat').value;
  if (!text) return toast('请输入内容');
  lifeItems.unshift({ text, cat, done: false, id: Date.now() });
  await saveToCloud('life', lifeItems); renderLife();
  $('#life-input').value = ''; toast('已添加');
}
async function toggleLife(i) { lifeItems[i].done = !lifeItems[i].done; await saveToCloud('life', lifeItems); renderLife(); }
async function removeLife(i) { lifeItems.splice(i,1); await saveToCloud('life', lifeItems); renderLife(); }

// ── 4. Travel Log ──
function renderTravels() {
  const list = $('#travel-list');
  list.innerHTML = travels.map((t,i) => `
    <div class="travel-item" style="animation-delay:${i*.06}s" onclick="openTravelDetail(${i})">
      <div class="travel-date">${t.date}</div>
      <div class="travel-location">${escHtml(t.location)}</div>
      ${t.note ? `<div class="travel-note">${escHtml(t.note)}</div>` : ''}
      ${t.img ? `<div class="travel-img"><img src="${escHtml(t.img)}" alt="" onerror="this.parentElement.style.display='none'" loading="lazy"></div>` : ''}
    </div>
  `).join('');
  if (!travels.length) list.innerHTML = '<div class="empty-state">还没有旅行记录，世界在等你 🌍</div>';
}
function toggleTravelForm() { $('#travel-form').classList.toggle('show'); }
async function addTravel() {
  const location = $('#travel-location').value.trim();
  const date = $('#travel-date').value || fmtDate(new Date());
  const note = $('#travel-note').value.trim();
  const img = $('#travel-img-url').value.trim();
  if (!location) return toast('请输入目的地');
  travels.unshift({ location, date, note, img, id: Date.now() });
  await saveToCloud('travel', travels); renderTravels(); toggleTravelForm();
  $('#travel-location').value = $('#travel-note').value = $('#travel-img-url').value = '';
  toast('旅行记录已保存');
}
function openTravelDetail(i) {
  const t = travels[i];
  $('#modal-location').textContent = t.location;
  $('#modal-note').textContent = t.note || '';
  $('#modal-date').textContent = t.date;
  $('#modal-img').src = t.img || '';
  $('#modal-img').style.display = t.img ? '' : 'none';
  $('#modal-overlay').classList.add('show');
}
function closeModal() { $('#modal-overlay').classList.remove('show'); }

// ── 5. Mood ──
document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});
function renderMoods() {
  const list = $('#mood-history');
  const recent = moods.slice(0, 10);
  list.innerHTML = recent.map((m,i) => `
    <div class="mood-entry" style="animation-delay:${i*.04}s">
      <span class="m-emoji">${m.mood}</span>
      <span class="m-text">${escHtml(m.note || '...')}</span>
      <span class="m-date">${m.date}</span>
    </div>
  `).join('');
  if (!recent.length) list.innerHTML = '<div class="empty-state">记录今天的心情吧 💭</div>';
  $('#mood-count').textContent = moods.length || '';
}
async function addMood() {
  if (!selectedMood) return toast('请先选择一个心情');
  const note = $('#mood-note').value.trim();
  const now = new Date();
  moods.unshift({ mood: selectedMood, note, date: fmtDate(now) + ' ' + fmtTime(now), id: Date.now() });
  await saveToCloud('mood', moods); renderMoods();
  $('#mood-note').value = ''; selectedMood = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  toast('心情已记录');
}

// ── 6. Body Management (MarkTimes) ──
let bodyTrack = 'exercise';
function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function getFirstDayOfMonth(y, m) { return new Date(y, m, 1).getDay(); }

function renderBody() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const daysInMonth = getDaysInMonth(y, m);
  const firstDay = getFirstDayOfMonth(y, m);
  const cal = $('#body-calendar');
  cal.querySelectorAll('.body-day').forEach(d => d.remove());

  for (let i = 0; i < firstDay; i++) { cal.appendChild(document.createElement('div')); }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = fmtDate(new Date(y, m, d));
    const ex = exercises.find(e => e.date === dateStr && e.type !== 'rest');
    const wt = weights.find(w => w.date === dateStr);
    const el = document.createElement('div');
    el.className = 'body-day';
    el.textContent = d;
    if (d === today) el.classList.add('today');
    if (ex && wt) el.classList.add('both-done');
    else if (ex) el.classList.add('ex-done');
    else if (wt) el.classList.add('wt-done');
    el.title = `${dateStr}${ex?' 运动✓':''}${wt?' 体重'+wt.value+'kg':''}`;
    el.addEventListener('click', () => {
      bodyTrack = ex ? 'weight' : 'exercise';
      document.querySelectorAll('.body-tab').forEach(t => t.classList.toggle('active', t.dataset.track === bodyTrack));
      switchPanel();
    });
    cal.appendChild(el);
  }

  // Exercise stats
  const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
  const monthEx = exercises.filter(e => e.date.startsWith(monthStr) && e.type !== 'rest');
  $('#ex-month').textContent = monthEx.length;
  $('#ex-total').textContent = exercises.filter(e => e.type !== 'rest').length;
  let streak = 0, check = new Date(y, m, today);
  while (true) {
    const ds = fmtDate(check);
    if (exercises.find(e => e.date===ds&&e.type!=='rest')) { streak++; check.setDate(check.getDate()-1); }
    else break;
  }
  $('#ex-streak').textContent = streak;
  const todayEx = exercises.find(e => e.date===fmtDate(now) && e.type!=='rest');
  const btn = $('#btn-ex-checkin');
  btn.className = 'body-checkin-btn' + (todayEx ? ' checked' : '');
  btn.querySelector('span').textContent = todayEx ? '✓' : '✓';
  btn.innerHTML = todayEx ? '<span>✓</span> 今日已打卡' : '<span>✓</span> 今日运动打卡';

  // Weight
  renderWeightPanel();
  switchPanel();
}

function switchPanel() {
  $('#panel-exercise').style.display = bodyTrack === 'exercise' ? '' : 'none';
  $('#panel-weight').style.display = bodyTrack === 'weight' ? '' : 'none';
  document.querySelectorAll('.body-tab').forEach(t => t.classList.toggle('active', t.dataset.track === bodyTrack));
}

function renderWeightPanel() {
  weights.sort((a,b) => a.date.localeCompare(b.date));
  if (weights.length) {
    const latest = weights[weights.length-1];
    $('#weight-now').textContent = latest.value;
    if (weights.length >= 2) {
      const prev = weights[weights.length-2];
      const delta = (latest.value - prev.value).toFixed(1);
      const del = $('#weight-delta');
      del.style.display = ''; del.textContent = (delta > 0 ? '+' : '') + delta;
      del.className = 'weight-delta ' + (delta > 0 ? 'up' : 'down');
    } else { $('#weight-delta').style.display = 'none'; }
  } else {
    $('#weight-now').textContent = '--'; $('#weight-delta').style.display = 'none';
  }
  const svg = $('#body-chart svg');
  if (weights.length < 2) {
    svg.innerHTML = `<text x="200" y="55" text-anchor="middle" fill="#b5aca4" font-size="11">记录体重以显示趋势</text>`;
  } else {
    const vals = weights.map(w => w.value);
    const min = Math.floor(Math.min(...vals) - 1);
    const max = Math.ceil(Math.max(...vals) + 1);
    const range = max - min || 1;
    const w = 400, h = 100, pad = 10;
    const pts = vals.map((v,i) => {
      const x = pad + (i/(vals.length-1))*(w-pad*2);
      const y = h-16-((v-min)/range)*(h-32);
      return `${x},${y}`;
    });
    const area = `M${pad},${h-16} L${pts.join(' L')} L${w-pad},${h-16} Z`;
    svg.innerHTML = `
      <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7eb8a0" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#7eb8a0" stop-opacity="0.02"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#bg)"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="#7eb8a0" stroke-width="2" stroke-linecap="round"/>
      ${vals.map((v,i)=>{const x=pad+(i/(vals.length-1))*(w-pad*2);const y=h-16-((v-min)/range)*(h-32);return`<circle cx="${x}" cy="${y}" r="3" fill="#fff" stroke="#7eb8a0" stroke-width="1.5"/>`;}).join('')}
      <text x="${w-pad}" y="12" text-anchor="end" fill="#b5aca4" font-size="9">${max}</text>
      <text x="${w-pad}" y="${h-18}" text-anchor="end" fill="#b5aca4" font-size="9">${min}</text>`;
  }
  const list = $('#weight-history');
  const recent = [...weights].reverse().slice(0, 6);
  list.innerHTML = recent.map((w,i) => {
    const idx = weights.indexOf(w);
    const delta = idx > 0 ? (w.value - weights[idx-1].value).toFixed(1) : null;
    const dHtml = delta ? `<span class="br-delta ${delta>0?'pos':'neg'}">${delta>0?'+':''}${delta}</span>` : '';
    return `<div class="body-recent-item" style="animation-delay:${i*.04}s">${dHtml}<span class="br-date">${w.date}</span><span class="br-val">${w.value} kg</span></div>`;
  }).join('');
  if (!recent.length) list.innerHTML = '<div class="empty-state">记录体重，看见变化</div>';
}

async function toggleExerciseToday() {
  const date = fmtDate(new Date());
  const idx = exercises.findIndex(e => e.date === date && e.type !== 'rest');
  if (idx >= 0) {
    exercises.splice(idx,1);
    await saveToCloud('exercise', exercises); renderBody(); toast('已取消打卡');
  } else {
    exercises.push({ date, type: 'done', id: Date.now() });
    await saveToCloud('exercise', exercises); renderBody(); toast('打卡成功！');
  }
}
async function addWeight() {
  const val = parseFloat($('#weight-input').value);
  if (isNaN(val) || val < 30 || val > 200) return toast('请输入有效体重');
  const date = fmtDate(new Date());
  const idx = weights.findIndex(w => w.date === date);
  if (idx >= 0) weights[idx].value = val;
  else weights.push({ date, value: val, id: Date.now() });
  await saveToCloud('weight', weights); renderBody();
  $('#weight-input').value = ''; toast('体重已记录');
}

// Async bootstrap
(async function init() {
  const seed = await bootstrap();

  if (seed) {
    todos = seed.todos || [];
    lifeItems = seed.life || [];
    travels = seed.travel || [];
    moods = seed.mood || [];
    exercises = seed.exercise || [];
    weights = seed.weight || [];
  } else {
    // Fallback to localStorage
    todos = loadLocal('todos');
    lifeItems = loadLocal('life');
    travels = loadLocal('travel');
    moods = loadLocal('mood');
    exercises = loadLocal('exercise');
    weights = loadLocal('weight');
  }

  renderTodos(); renderLife(); renderTravels();
  renderMoods(); renderBody();
})();
